[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "hea_reachy_mini"
version = "0.6.0"
description = "A safe typed and spoken public HEA client for Reachy Mini Lite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reachy-mini==1.10.0",
    "requests==2.34.2",
]
keywords = ["reachy-mini-app"]
license = { file = "LICENSE" }
authors = [{ name = "HEA-World" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://hea-world.com/hea_pages/hea_reachymini.html"
Support = "https://hea-world.com/hea_pages/hea_contact.html"
Source = "https://github.com/HEA-World/hea-reachymini-app"
Issues = "https://github.com/HEA-World/hea-reachymini-app/issues"
Space = "https://huggingface.co/spaces/HEA-World/hea-reachymini-app"

[project.entry-points."reachy_mini_apps"]
hea_reachy_mini = "hea_reachy_mini.main:HeaReachyMini"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
hea_reachy_mini = ["**/*"] # Also include all non-.py files

[tool.unittest]
start-directory = "tests"
